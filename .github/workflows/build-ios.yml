name: Build Cinema Camera iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos

      - name: Build Metal Shaders and Swift Targets
        run: |
          xcodebuild -project CinemaCamera.xcodeproj \
            -scheme CinemaCamera \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos \
            clean build

      - name: Package Unsigned Payload
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/CinemaCamera.app Payload/
          zip -r CinemaCamera_unsigned.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CinemaCamera-IPA
          path: CinemaCamera_unsigned.ipa
